
services:

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    environment:
      TZ: ${TZ}
    ports:
      - "${JELLYFIN_PORT}:8096"
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-cache:/cache
      - ${MEDIA_ROOT}:/data

    healthcheck:
      test: ["CMD-SHELL","wget --spider --quiet http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "${PROWLARR_PORT}:9696"
    volumes:
      - ./prowlarr:/config
    healthcheck:
      test: ["CMD-SHELL","wget --spider --quiet http://localhost:9696 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - media

  radarr:
    # image: lscr.io/linuxserver/radarr:latest
    image: ghcr.io/hotio/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "${RADARR_PORT}:7878"
    volumes:
      - ./radarr-config:/config
      - ${MEDIA_ROOT}:/data
    healthcheck:
      test: ["CMD-SHELL","wget --spider --quiet http://localhost:7878 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - media

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "${SONARR_PORT}:8989"
    volumes:
      - ./sonarr-config:/config
      - ${MEDIA_ROOT}:/data
    healthcheck:
      test: ["CMD-SHELL","wget --spider --quiet http://localhost:8989 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - media

  seerr:
    image: seerr/seerr:latest
    container_name: seerr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    ports:
      - "${SEERR_PORT}:5055"
    volumes:
      - ./seerr/config:/app/config
    healthcheck:
      test: ["CMD-SHELL","wget --spider --quiet http://localhost:5055 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - media

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: ${TZ}
    ports:
      - "${FLARESOLVERR_PORT}:8191"
    networks:
      - media

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${WEBUI_PORT}

    ports:
      - "${QBITTORRENT_WEB_PORT}:8080"
      - "${QBITTORRENT_TORRENT_PORT}:6881"
      - "${QBITTORRENT_TORRENT_PORT_UDP}:6881/udp"

    volumes:
      - ./qbittorrent/config:/config
      - ${MEDIA_ROOT}:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

    networks:
      - media

