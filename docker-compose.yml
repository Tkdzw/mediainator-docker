services:

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ./jellyfin-config:/config
      - ./jellyfin-cache:/cache
      - "C:/Users/Asher/Videos:/videos"
    restart: unless-stopped

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: deluge
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Harare
    ports:
      - "8112:8112"   # Web UI
      - "58846:58846" # Daemon
      - "58946:58946"
    volumes:
      - ./deluge/config:/config
      - C:/Users/Asher/Videos/Downloads:/downloads
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Harare
    volumes:
      - ./radarr-config:/config
      - "C:/Users/Asher/Videos:/videos"
      - "C:/Users/Asher/Videos:/downloads"
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Harare
    volumes:
      - ./sonarr-config:/config
      - "C:/Users/Asher/Videos:/videos"
      - "C:/Users/Asher/Videos:/downloads"
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Africa/Harare
    volumes:
      - ./prowlarr:/config
    restart: unless-stopped

